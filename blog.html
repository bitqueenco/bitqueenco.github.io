<style>
  :root {
    --sat-orange: #F7931A;   /* Bitcoin / Satoshi orange */
    --sat-light:  #FFB347;
    --sat-deep:   #C86E08;
    --sat-darker: #8A4600;
    --sat-dark:   #1B0F02;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: var(--sat-dark);
    font-family: 'Satoshi', 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 50% 45%, var(--sat-light) 0%, var(--sat-orange) 40%, var(--sat-deep) 90%);
  }

  /* Crypto grid background */
  body::before {
    content: "";
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    inset: 0;
    background-image:
      linear-gradient(rgba(27,15,2,.12) 1px, transparent 1px),
      linear-gradient(90deg, rgba(27,15,2,.12) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
    z-index: 0;
  }

  /* Falling crypto symbols in background */
  #coins { position: fixed; top: 0; right: 0; bottom: 0; left: 0; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .coin {
    position: absolute;
    top: -80px;
    font-weight: 900;
    color: rgba(27,15,2,.16);
    animation: coinFall linear infinite;
    user-select: none;
  }
  @keyframes coinFall {
    to { transform: translateY(115vh) rotate(360deg); }
  }

  /* ---------- Header ---------- */
  header {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
    padding: 12px 20px;
    padding: 12px clamp(10px, 4vw, 40px);
    background: var(--sat-orange);
    border-bottom: 4px solid var(--sat-dark);
    box-shadow: 0 4px 0 rgba(27,15,2,.25);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; font-weight: 900; font-size: 1.3rem; font-size: clamp(.95rem, 3.5vw, 1.5rem); letter-spacing: 1px; }
  .brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .logo { flex-shrink: 0; }
  .status { flex-shrink: 0; white-space: nowrap; }
  .logo {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    background: var(--sat-dark);
    color: var(--sat-orange);
    border-radius: 50%;
    font-size: 1.5rem;
    font-weight: 900;
    animation: logoSpin 6s linear infinite;
  }
  @keyframes logoSpin { to { transform: rotateY(360deg); } }
  .status {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px;
    background: var(--sat-dark);
    color: var(--sat-orange);
    font-size: .8rem; font-weight: 700; letter-spacing: 2px;
  }
  .status i { width: 9px; height: 9px; border-radius: 50%; background: #3dff8a; box-shadow: 0 0 8px #3dff8a; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  /* Ticker strip */
  .ticker {
    position: relative;
    z-index: 2;
    overflow: hidden;
    white-space: nowrap;
    flex-shrink: 0;
    background: var(--sat-dark);
    color: var(--sat-orange);
    font-weight: 700;
    font-size: .85rem;
    letter-spacing: 2px;
    padding: 8px 0;
  }
  .ticker span {
    display: inline-block;
    padding-left: 100%;
    animation: marquee 22s linear infinite;
  }
  @keyframes marquee { to { transform: translateX(-100%); } }

  /* ---------- Main ---------- */
  main {
    position: relative;
    z-index: 1;
    flex: 1 1 auto;
    min-height: 0;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    --sh: 8px;
  }
  /* Modern browsers: the square box always fits the space left between header and footer */
  @supports (width: 1cqw) {
    main { container-type: size; }
    .box {
      width: min(calc(min(100cqw, 100cqh) - var(--sh)), 640px);
      height: min(calc(min(100cqw, 100cqh) - var(--sh)), 640px);
    }
  }
  .fall { animation: fall .7s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes fall {
    0%   { transform: translateY(-110vh); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }

  /* Big square box */
  .box {
    position: relative;
    width: 80vw;
    height: 80vw;
    width: min(86vw, 50vh, 520px);
    height: min(86vw, 50vh, 520px);
    flex-shrink: 0;
    border: 5px solid var(--sat-dark);
    border-radius: 0;
    overflow: hidden;
    background: radial-gradient(circle at 50% 50%, #4a2806 0%, var(--sat-dark) 100%);
    box-shadow: 8px 8px 0 var(--sat-darker), 0 0 40px rgba(255, 190, 90, .55);
  }
  /* corner brackets */
  .box::before, .box::after {
    content: "";
    position: absolute;
    width: 28px; height: 28px;
    border: 3px solid var(--sat-orange);
    z-index: 3;
    pointer-events: none;
  }
  .box::before { top: 8px; left: 8px; border-right: none; border-bottom: none; }
  .box::after  { bottom: 8px; right: 8px; border-left: none; border-top: none; }

  /* Streaks to feel like falling down (move upward) */
  .streaks { position: absolute; top: 0; right: 0; bottom: 0; left: 0; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
  .streak {
    position: absolute;
    top: 0;
    width: 2px;
    background: linear-gradient(to bottom, transparent, rgba(247,147,26,.8), transparent);
    animation: streakUp linear infinite;
  }
  @keyframes streakUp {
    from { transform: translateY(120%); }
    to   { transform: translateY(-130%); }
  }

  /* 3D stage so image tumbles from all sides */
  .stage {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .spinner {
    display: block;
    width: 78%;
    height: auto;
    max-height: 100%;
    object-fit: contain;
    transform-origin: 50% 50%;
    animation: tumble 6s forwards;
    will-change: transform;
  }

  /* 0-6%:    lower face zoomed in
     6-18%:   zoom out (lower face)
     18-30%:  half tumble one way (all axes)
     30-42%:  half tumble back
     42-100%: tumbling on X, Y and Z together while zooming out, lands upright */
  @keyframes tumble {
    /* PHASE 1 (0-2s): zoomed in on lower face, fast swing left, right, left, right */
    0%      { transform: rotate(0deg)     scale(5) translateY(-11%); animation-timing-function: linear; }
    8.33%   { transform: rotate(-450deg)  scale(5) translateY(-11%); animation-timing-function: linear; }
    16.67%  { transform: rotate(0deg)     scale(5) translateY(-11%); animation-timing-function: linear; }
    25%     { transform: rotate(-450deg)  scale(5) translateY(-11%); animation-timing-function: linear; }
    33.33%  { transform: rotate(0deg)     scale(5) translateY(-11%); animation-timing-function: ease-out; }
    /* quick reverse burst between phase 1 and 2 (~0.15s) */
    35.83%  { transform: rotate(300deg)   scale(3.4) translateY(-11%); animation-timing-function: linear; }
    /* PHASE 2 (2-4s): half face visible, same circular spin left, right, left, right */
    41.67%  { transform: rotate(-450deg)  scale(2) translateY(-11%); animation-timing-function: linear; }
    50%     { transform: rotate(0deg)     scale(2) translateY(-11%); animation-timing-function: linear; }
    58.33%  { transform: rotate(-450deg)  scale(2) translateY(-11%); animation-timing-function: linear; }
    66.67%  { transform: rotate(0deg)     scale(2) translateY(-11%); translate: 0 0; opacity: 1; animation-timing-function: ease-out; }
    /* quick reverse burst between phase 2 and 3 (~0.15s) */
    69.17%  { transform: rotate(-300deg)  scale(1.6) translateY(-5%); translate: 0 0; opacity: 1; animation-timing-function: linear; }
    /* PHASE 3 (4-6s): fast spin, zooms out to microscopic size and drops away like falling down */
    80%     { transform: rotate(720deg)   scale(0.9) translateY(0); translate: 0 4%; opacity: 1; animation-timing-function: linear; }
    92%     { transform: rotate(1440deg)  scale(0.25) translateY(0); translate: 0 14%; opacity: 1; animation-timing-function: cubic-bezier(.5,0,.9,.6); }
    100%    { transform: rotate(2160deg)  scale(0.005) translateY(0); translate: 0 32%; opacity: 0; }
  }

  /* ---------- Footer ---------- */
  footer {
    position: relative;
    z-index: 2;
    flex-shrink: 0;
    padding: 16px 20px 18px;
    padding: 16px clamp(10px, 4vw, 40px) 18px;
    text-align: center;
    background: var(--sat-deep);
    border-top: 4px solid var(--sat-dark);
    box-shadow: 0 -4px 0 rgba(27,15,2,.25);
  }
  .loading {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    font-size: 1.5rem;
    font-size: clamp(1.05rem, 4.5vw, 1.9rem);
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 3px 3px 0 var(--sat-dark);
    animation: pulse 1s ease-in-out infinite;
  }
  .loading .dot { display: inline-block; animation: bounce .8s infinite; }
  .loading .dot:nth-child(2) { animation-delay: .15s; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

  .bar {
    width: min(90%, 420px);
    height: 12px;
    margin: 12px auto 8px;
    background: var(--sat-dark);
    border: 2px solid var(--sat-dark);
  }
  .bar b {
    display: block;
    height: 100%;
    width: 0;
    background: repeating-linear-gradient(45deg, var(--sat-orange) 0 10px, var(--sat-light) 10px 20px);
    animation: fill 6s linear forwards;
  }
  @keyframes fill { to { width: 100%; } }
  .meta { font-size: .75rem; font-weight: 700; letter-spacing: 2px; color: var(--sat-dark); text-transform: uppercase; }

  /* ---------- Responsive ---------- */

  /* Short screens (landscape phones, small feature phones): save vertical space */
  @media (max-height: 520px) {
    header { padding-top: 6px; padding-bottom: 6px; border-bottom-width: 3px; }
    .logo { width: 30px; height: 30px; font-size: 1.15rem; }
    .ticker { display: none; }
    footer { padding-top: 8px; padding-bottom: 8px; border-top-width: 3px; }
    .bar { height: 8px; margin: 6px auto 4px; }
    .meta { display: none; }
    main { padding: 8px; --sh: 6px; }
    .box { box-shadow: 6px 6px 0 var(--sat-darker), 0 0 30px rgba(255, 190, 90, .5); }
  }

  /* Very short screens */
  @media (max-height: 300px) {
    .bar { display: none; }
    .status { display: none; }
    .loading { font-size: 1rem; }
  }

  /* Small phones */
  @media (max-width: 380px) {
    .box { border-width: 3px; }
    .box::before, .box::after { width: 16px; height: 16px; border-width: 2px; }
    .box::before { top: 5px; left: 5px; }
    .box::after { bottom: 5px; right: 5px; }
    .logo { width: 32px; height: 32px; font-size: 1.2rem; }
    .brand { gap: 6px; letter-spacing: 0; }
    .status { padding: 4px 8px; font-size: .65rem; letter-spacing: 1px; gap: 5px; }
    .ticker { font-size: .7rem; letter-spacing: 1px; }
    .loading { letter-spacing: 2px; text-shadow: 2px 2px 0 var(--sat-dark); }
    .meta { font-size: .6rem; letter-spacing: 1px; }
  }

  /* Tiny / feature-phone width (240-280px) */
  @media (max-width: 280px) {
    header { padding-left: 6px; padding-right: 6px; gap: 6px; }
    .logo { width: 26px; height: 26px; font-size: 1rem; }
    .status { padding: 3px 6px; font-size: .55rem; letter-spacing: 0; }
    .status i { width: 6px; height: 6px; }
    .loading { font-size: .95rem; letter-spacing: 1px; }
    .meta { font-size: .5rem; letter-spacing: 0; }
    footer { padding-left: 6px; padding-right: 6px; }
  }

  /* Large screens */
  @media (min-width: 1200px) {
    .ticker { font-size: .95rem; }
  }
</style>
</head>
<body>
  <div id="coins"></div>

  <header>
    <div class="brand"><div class="logo">&#8383;</div><span>BitQueenCo</span></div>
    <div class="status"><i></i>ONLINE</div>
  </header>

  <div class="ticker"><span>&#8383; BITCOIN &bull; HODL &bull; DECENTRALIZED &bull; BLOCKCHAIN &bull; SATOSHI &bull; WEB3 &bull; TO THE MOON &bull; NOT YOUR KEYS NOT YOUR COINS &bull; &#8383; BITCOIN &bull; HODL &bull; DECENTRALIZED &bull; BLOCKCHAIN &bull; SATOSHI &bull; WEB3 &bull;</span></div>

  <main>
    <div class="fall">
      <div class="box">
        <div class="streaks" id="streaks"></div>
        <div class="stage">
          <img class="spinner" src="https://bitqueenco.github.io/04%20Portfolio/assets/images/bitqaww.png" alt="BitQueenCo">
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="loading" id="loadingText" role="button" tabindex="0" aria-live="polite">Loading<span class="dot">.</span><span class="dot">.</span></div>
    <div class="bar"><b id="barFill"></b></div>
    <div class="meta" id="metaText">Syncing blocks &bull; &copy; BitQueenCo</div>
  </footer>

<script>
  // Falling background crypto symbols
  (function () {
    var symbols = ['\u20BF', '\u039E', '\u20BF', '\u25C8', '\u20BF', '\u26A1'];
    var wrap = document.getElementById('coins');
    for (var i = 0; i < 18; i++) {
      var c = document.createElement('div');
      c.className = 'coin';
      c.textContent = symbols[i % symbols.length];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.fontSize = (20 + Math.random() * 50) + 'px';
      c.style.animationDuration = (5 + Math.random() * 7) + 's';
      c.style.animationDelay = (-Math.random() * 10) + 's';
      wrap.appendChild(c);
    }
    // Falling-speed streaks inside the box
    var s = document.getElementById('streaks');
    for (var j = 0; j < 22; j++) {
      var l = document.createElement('div');
      l.className = 'streak';
      l.style.left = Math.random() * 100 + '%';
      l.style.height = (30 + Math.random() * 50) + '%';
      l.style.animationDuration = (0.6 + Math.random() * 0.9) + 's';
      l.style.animationDelay = (-Math.random() * 1.5) + 's';
      s.appendChild(l);
    }
  })();

  var target = "https://bitqueenco.blogspot.com";
  // Redirect after 6 seconds
  var redirectTimer = setTimeout(function () {
    window.location.replace(target);
  }, 6000);

  // Click / touch on "Loading" stops the redirect and loops the spin until browser refresh
  var loadingText = document.getElementById('loadingText');
  var paused = false;
  function stopRedirect() {
    if (paused) return;
    paused = true;
    clearTimeout(redirectTimer);
    document.querySelector('.spinner').style.animationIterationCount = 'infinite';
    document.getElementById('barFill').style.animationIterationCount = 'infinite';
    document.getElementById('metaText').innerHTML = 'Redirect paused &bull; Refresh to restart';
    loadingText.style.cursor = 'default';
  }
  loadingText.addEventListener('click', stopRedirect);
  loadingText.addEventListener('touchstart', stopRedirect, { passive: true });
  loadingText.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') stopRedirect();
  });
</script>
</body>
